apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-devops-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: my-devops-app

  template:
    metadata:
      labels:
        app: my-devops-app

    spec:
      containers:
      - name: my-devops-app

        image: shashiwali/myapp:v1

        ports:
        - containerPort: 80
